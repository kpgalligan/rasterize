name: Rasterize
options:
  bundleIdPrefix: com.kgalligan
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

targets:
  Rasterize:
    type: application
    platform: macOS
    sources:
      - path: app/Sources
    settings:
      base:
        PRODUCT_NAME: Rasterize
        # The Rust core is built for the host arch only; for a universal app,
        # cargo-build both targets and lipo them, then widen this.
        ARCHS: arm64
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: app/Bridging/Rasterize-Bridging-Header.h
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/core/target/release
        OTHER_LDFLAGS:
          - -lrasterize_core
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    info:
      path: app/Info.plist
      properties:
        CFBundleName: Rasterize
        CFBundleDisplayName: Rasterize
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        LSApplicationCategoryType: public.app-category.graphics-design
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: ""
        CFBundleDocumentTypes:
          - CFBundleTypeName: PNG Image
            LSItemContentTypes: [public.png]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: JPEG Image
            LSItemContentTypes: [public.jpeg]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: Photoshop Document
            LSItemContentTypes: [com.adobe.photoshop-image]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: TIFF Image
            LSItemContentTypes: [public.tiff]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: BMP Image
            LSItemContentTypes: [com.microsoft.bmp]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: GIF Image
            LSItemContentTypes: [com.compuserve.gif]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
          - CFBundleTypeName: WebP Image
            LSItemContentTypes: [org.webmproject.webp]
            CFBundleTypeRole: Editor
            NSDocumentClass: Rasterize.ImageDocument
            LSHandlerRank: Alternate
    preBuildScripts:
      - name: Build Rust Core
        script: |
          set -e
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$PROJECT_DIR/core"
          cargo build --release
        outputFiles:
          - $(PROJECT_DIR)/core/target/release/librasterize_core.a

schemes:
  Rasterize:
    build:
      targets:
        Rasterize: all
    run:
      config: Release
