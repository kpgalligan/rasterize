[package]
name = "rasterize-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "rasterize_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
image = "0.25"
psd = "0.3"
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
